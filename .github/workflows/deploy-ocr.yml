name: Deploy OCR

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy OCR source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "*.py,requirements.txt,README.md"
          target: "/opt/evarkadasim/ocr"
          strip_components: 0

      - name: Install OCR requirements and restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            chown -R evarkadasim:evarkadasim /opt/evarkadasim/ocr
            sudo -u evarkadasim /opt/evarkadasim/ocr/.venv/bin/pip install -r /opt/evarkadasim/ocr/requirements.txt
            systemctl restart evarkadasim-ocr
            systemctl status evarkadasim-ocr --no-pager